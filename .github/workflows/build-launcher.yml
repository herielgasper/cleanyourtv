name: Build launcher APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Build
        working-directory: launcher
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk tvhome.apk
          gh release delete launcher --yes --cleanup-tag || true
          gh release create launcher tvhome.apk --title "TV launcher" --notes "Built from ${{ github.sha }}"
